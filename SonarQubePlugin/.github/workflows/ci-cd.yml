name: SEC-AI CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Backend Build and Test
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: 'yarn'

      - name: Install Frontend Dependencies
        run: yarn install

      - name: Run Backend Tests
        # This will run tests and generate JaCoCo reports (assuming configuration in pom.xml)
        run: mvn test

      - name: Build Maven Project
        run: mvn clean compile

      - name: Upload Test/Coverage Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-reports
          # Upload JaCoCo XML report and Surefire test reports
          path: |
            target/surefire-reports/
            target/site/jacoco/jacoco.xml

            
  # Frontend Test
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install

      - name: Run Frontend Tests with Coverage
        # Added --coverage flag to generate LCOV report for SonarQube
        run: yarn test --coverage --watchAll=false

      - name: Build Frontend
        run: yarn build

      - name: Upload Coverage Report (LCOV)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-lcov-report
          path: coverage/lcov.info


  # Security Scan
  security-scan:
    runs-on: ubuntu-latest
    needs: [backend-test]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'SonarQubePlugin'
          path: '.'
          format: 'HTML'
          args: '--enableRetired'

      - name: Upload OWASP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-report
          path: reports/


  # Build Plugin
  build-plugin:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: 'yarn'

      - name: Install Frontend Dependencies
        run: yarn install

      - name: Build SonarQube Plugin
        run: mvn clean package

      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-plugin
          path: target/*.jar

  # SonarQube Analysis (now on all pushes/PRs for coverage visibility)
  sonarqube-analysis:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    # The 'if: github.ref == "refs/heads/main"' condition was removed to run on all pushes/PRs
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Download the coverage reports generated by the parallel jobs
      - name: Download Backend JaCoCo Report
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage-reports
          # Downloads reports to their expected locations (target/site/jacoco/jacoco.xml)
          path: .

      - name: Download Frontend LCOV Report
        uses: actions/download-artifact@v4
        with:
          name: frontend-lcov-report
          # Downloads reports to their expected locations (coverage/lcov.info)
          path: .
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: 'yarn'

      - name: Install Frontend Dependencies
        # Needed for the SonarQube scanner environment
        run: yarn install

      - name: SonarQube Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # Pass the paths of the pre-generated coverage reports to the SonarQube scanner.
          mvn sonar:sonar \
            -Dsonar.projectKey=secai-plugin \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
