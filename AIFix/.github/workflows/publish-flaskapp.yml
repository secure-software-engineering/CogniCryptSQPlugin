# .github/workflows/publish-flaskapp.yml

name: Build and Publish Flask App Image

# This workflow triggers on every push to the "main" branch
on:
  workflow_dispatch:

jobs:
  build-and-push:
    # The job will run on the latest version of an Ubuntu runner
    runs-on: ubuntu-latest

    steps:
      # 1. Get the repository code
      - name: Check out the repository
        uses: actions/checkout@v4

      # 2. Log in to Docker Hub using the secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # 3. Build and push the Docker image
      - name: Build and push image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          # The context is the './flaskapp' directory where the Dockerfile is located
          context: .
          # Push the built image to the registry
          push: true
          # Tag the image with your Docker Hub username and "latest"
          tags: ${{ secrets.DOCKER_USERNAME }}/flaskapp:latest
