services:
  nginx:
    image: nginx:1.29.5
    container_name: nginx
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 80:80
    networks:
      - internal
    depends_on:
      - flaskapp
    restart: unless-stopped
    
  flaskapp:
    build: ./Flaskapp
    container_name: flaskapp
    env_file:
      - ./Flaskapp/aifix/.env
    volumes:
      - ./Flaskapp:/app
    networks:
      internal:
        aliases:
          - flask-app
    restart: unless-stopped

networks:
  internal: